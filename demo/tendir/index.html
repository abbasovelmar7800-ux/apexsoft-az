<!DOCTYPE html>
<html lang="az">
<head>
  <base href="/demo/tendir/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="description" content="Apex Təndir ERP — ApexSoft canlı demo. Nümunə məlumatlarla işləyir.">
  <meta name="theme-color" content="#FBF6F1">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Apex Təndir ERP — demo · ApexSoft</title>
  <style>
    html,body{margin:0;height:100%;background:#FBF6F1}
    #ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#5A2E12;transition:opacity .3s}
    #ld i{width:42px;height:42px;border-radius:50%;border:4px solid rgba(180,98,43,.15);border-top-color:#B4622B;animation:sp .9s linear infinite}
    #ld small{font-weight:500;opacity:.6}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="ld"><i></i><span>Apex Təndir ERP açılır…</span><small>ApexSoft demo</small></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('ld'); if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
